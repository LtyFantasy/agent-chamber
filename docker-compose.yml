services:
  postgres:
    image: postgres:15-alpine
    container_name: chamber-postgres
    restart: unless-stopped
    environment:
      # 插值自 .env 的 DB_* 键（无 .env 时默认值 = 原硬编码值，行为等价），
      # 使 .env 的 DB_PASSWORD 单一事实来源注释名实相符
      POSTGRES_USER: ${DB_USERNAME:-chamber}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chamber_password}
      POSTGRES_DB: ${DB_DATABASE:-agent_chamber}
    ports:
      - "8744:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamber -d agent_chamber"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO 对象存储（MinIO 媒体附件 P0，plan §6.1）
  # container_name chamber-minio：deploy.sh 自举/卷备份、运维脚本统一按此名寻址。
  # 端口恒绑 127.0.0.1（console 9001 带 root 凭据，绝不绑 0.0.0.0；DEPLOY.md 写明
  # 防火墙不开 9000/9001）；MINIO_PORT/MINIO_CONSOLE_PORT 参数化供 9000 被占用机
  # 用 shell env 覆盖（compose 变量替换只读同目录 .env——无 .env 机须显式 export，
  # 如本机 MINIO_PORT=19000 MINIO_CONSOLE_PORT=19001）。
  minio:
    image: minio/minio
    container_name: chamber-minio
    restart: unless-stopped
    # --console-address 固定 9001：缺省 console 端口动态分配，9001 映射将落空
    command: server /data --console-address ":9001"
    environment:
      # 插值风格对齐 DB_*：与 backend 段 MINIO_ACCESS_KEY/SECRET_KEY 同源，
      # 无 .env 时默认值 = 开发占位值（生产必须经 .env 覆盖）
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_root_user}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-minio-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # 构建期镜像源注入（可选，默认空=官方源）：境外网络环境构建前
        # export APK_MIRROR=mirrors.aliyun.com NPM_REGISTRY=https://mirrors.cloud.tencent.com/npm
        APK_MIRROR: ${APK_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: chamber-backend
    # migration 失败等启动即 crash 时最多重启 5 次后停止（on-failure:5），
    # 避免 DB 配置错误导致的无休止 crash 循环刷日志
    restart: on-failure:5
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      # DB_* 插值自 .env（默认值与原硬编码值一致，无 .env 时行为不变）
      DB_USERNAME: ${DB_USERNAME:-chamber}
      DB_PASSWORD: ${DB_PASSWORD:-chamber_password}
      DB_NAME: ${DB_DATABASE:-agent_chamber}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production-refresh}
      # MinIO 插值自 .env（镜像 DB_HOST 先例）：容器内 127.0.0.1 指向自身，
      # endpoint 用服务名 minio；MINIO_PORT 恒 9000（容器间网络直连不经宿主机
      # 映射——宿主机 MINIO_PORT=19000 之类的覆盖只影响宿主机侧映射端口）
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_root_user}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-agent-chamber-attachments}
    ports:
      - "8743:8743"
    depends_on:
      postgres:
        condition: service_healthy
      # 启动顺序保证 OnModuleInit bucket 自举时 MinIO 已就绪（storage 虽 fail-open
      # 不崩，但 bucket 不自建会让上传路径 500）
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Next.js 的 NEXT_PUBLIC_* 在构建期内联，runtime environment 不生效；
        # 非本机部署时必须改这里并重建（--build）
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8743/api/v1}
        APK_MIRROR: ${APK_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: chamber-web
    restart: unless-stopped
    ports:
      - "8742:8742"
    depends_on:
      - backend

  # MCP 入口（agent 直连）：从 backend Swagger 动态生成 80+ tools（当前实测 82）
  # backend 未就绪时启动会失败，由 restart 策略自动重试
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.automcp
      args:
        APK_MIRROR: ${APK_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: chamber-mcp
    restart: unless-stopped
    ports:
      - "8745:8745"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
